<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100"><rect width="850" height="1100" fill="#fff"/><rect x="50" y="50" width="750" height="1000" fill="#fbfcfe" stroke="#cbd5e1"/><g font-family="Arial,sans-serif" fill="#17253e"><text x="90" y="120" font-size="18" fill="#bd4936">FICTIONAL SAMPLE — FOR TESTING ONLY</text><text x="90" y="185" font-size="30" font-weight="bold">Example Town Electricity Office</text><text x="90" y="235" font-size="22">Outstanding Electricity Payment Notice</text><text x="90" y="310" font-size="18">Document date: 28 October 2026</text><text x="90" y="350" font-size="18">Reference: SAMPLE-2026-001</text><text x="90" y="390" font-size="18">Recipient: Sample Resident (fictional)</text><text x="90" y="470" font-size="20">An outstanding payment of INR 1,250 is recorded.</text><text x="90" y="515" font-size="20">Please pay on or before 15 November 2026.</text><text x="90" y="590" font-size="18">Please review your bill and bring a copy of the notice</text><text x="90" y="625" font-size="18">when visiting the office about this payment.</text><text x="90" y="705" font-size="18">No late fee or disconnection rule is specified here.</text><text x="90" y="790" font-size="17" fill="#64748b">This is not an actual government notice.</text><text x="90" y="825" font-size="17" fill="#64748b">It contains no real personal information.</text><text x="90" y="860" font-size="17" fill="#64748b">No payment link or contact number is provided.</text></g></svg>
